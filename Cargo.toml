[package]
name = "broll"
version = "0.2.0"
edition = "2024"
description = "Terminal session recorder with searchable, timestamped output"
license = "MIT"
repository = "https://github.com/rodbove/broll"
homepage = "https://github.com/rodbove/broll"
readme = "README.md"
keywords = ["terminal", "recorder", "tui", "shell", "session"]
categories = ["command-line-utilities"]
exclude = ["docs/", "test-samples/", "IDEAS.md", "install-local.sh", "CLAUDE.md"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Terminal / PTY
crossterm = "0.28"
portable-pty = "0.8"

# TUI
ratatui = "0.29"

# Storage
rusqlite = { version = "0.38", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
regex = "1"
anyhow = "1"
signal-hook = "0.3"
strip-ansi-escapes = "0.2"
tempfile = "3"
vt100 = "0.15"
